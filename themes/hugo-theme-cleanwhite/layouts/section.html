{{ define "main" }}
<!-- Section page (used for News & Events): shows the page text, then a list of its posts, newest first -->
<article>
    <div class="container">
        <div class="row">
            <div class="col-xs-12 post-container">
                {{ .Content }}

                <div class="news-list">
                {{ range .Pages.ByDate.Reverse }}
                    <div class="news-item">
                        <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
                        <p class="news-meta">{{ .Date.Format "2 January 2006" }}{{ with .Params.subtitle }} &middot; {{ . }}{{ end }}</p>
                        <p>{{ .Summary | plainify | truncate 240 }}</p>
                    </div>
                {{ end }}
                </div>
            </div>
        </div>
    </div>
</article>
{{ end }}
