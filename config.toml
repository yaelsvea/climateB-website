# ---------------------------------------------------------------
# climateB website: main settings file
# Change the text between the quotation marks, save, and the
# preview in RStudio updates. Lines starting with # are comments.
# ---------------------------------------------------------------

# "/" works for the local preview. The GitHub deploy workflow
# replaces this automatically with the real web address.
baseURL = "/"
title = "climateB"
theme = "hugo-theme-cleanwhite"
languageCode = "en-us"
preserveTaxonomyNames = true

[pagination]
  pagerSize = 5

[params]
  # Big picture behind the page titles (file in static/img/).
  # To use a real photo: put it in static/img/ and change the file name here.
  header_image = "img/header-placeholder.jpg"
  SEOTitle = "climateB | Climate action in banks"
  description = "climateB studies how investor, NGO and industry pressure shapes banks' climate strategies. A research project at the University of St. Gallen (HSG)."
  keyword = "climateB, banks, climate finance, non-state pressure, HSG"
  slogan = "Climate action in banks: unpacking the role of non-state pressures"
  upstreamAttribution = true

  image_404 = "img/header-placeholder.jpg"
  title_404 = "Page not found"
  omit_categories = true

  # Own style file (static/css/climateb.css): logo bar, full-width text
  custom_css = ["css/climateb.css"]
  custom_js = ["js/climateb-slider.js"]

  # Features switched off
  dark_mode_toggle = false
  algolia_search = false
  page_view_counter = false
  artalk_enable = false
  reward = false
  friends = false
  bookmarks = false
  about_me = false
  last_posts = false
  featured_tags = false

  # Top menu, in this order (the first entry "Home" is built into the theme).
  # href = name of the folder in content/
  [[params.additional_menus]]
    title = "RESEARCH"
    href = "research"
  [[params.additional_menus]]
    title = "DATA & INSIGHTS"
    href = "data-insights"
  [[params.additional_menus]]
    title = "PUBLICATIONS"
    href = "publications"
  [[params.additional_menus]]
    title = "TEAM"
    href = "team"
  [[params.additional_menus]]
    title = "NEWS & EVENTS"
    href = "news-events"

[markup]
  [markup.tableOfContents]
    endLevel = 2
    startLevel = 1
  [markup.highlight]
    style = "github"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true   # allows raw HTML (needed later for embedded charts)
